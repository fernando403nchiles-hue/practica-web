<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoXpress | Venta de Motocicletas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="navbar">
        <div class="logo">Moto<span>Xpress</span></div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html" target="_blank" rel="noopener noreferrer">Quiénes Somos</a>
            <a href="garantias.html" target="_blank" rel="noopener noreferrer">Garantías</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>Encuentra la moto ideal para tu día a día</h1>
            <p>Modelos de trabajo, urbanas y deportivas al mejor precio.</p>
            <a href="#catalogo" class="btn-primary">Ver Catálogo</a>
        </div>
    </section>

    <section id="catalogo" class="catalog-section">
        <h2>Nuestro Catálogo</h2>
        
        <div class="filter-container">
            <label for="tipo-filtro">Filtrar por tipo:</label>
            <select id="tipo-filtro">
                <option value="todos">Todas las categorías</option>
                <option value="trabajo">Trabajo / Urbana</option>
                <option value="deportiva">Deportiva</option>
            </select>
        </div>

        <div id="contenedor-motos" class="grid-motos"></div>
    </section>

    <section id="contacto" class="contact-section">
        <h2>Solicita una Cotización</h2>
        <form id="form-cotizacion" class="form-container">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="moto-interes">Moto de Interés:</label>
                <input type="text" id="moto-interes" required placeholder="Ej. FT125 / Deportiva 250">
            </div>
            <div class="form-group">
                <label for="whatsapp">Número de Celular:</label>
                <input type="tel" id="whatsapp" required placeholder="Ej. 3123456789">
            </div>
            <button type="submit" class="btn-submit">Enviar Solicitud</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 MotoXpress - Pasión por las dos ruedas.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
